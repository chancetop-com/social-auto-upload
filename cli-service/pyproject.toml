[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "social-media-worker"
dynamic = ["version"]
requires-python = ">=3.10,<3.13"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
cli-service = "sau_worker.__main__:main"
social-media-worker = "sau_worker.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "sau_worker.__version__"}

[tool.setuptools.packages.find]
include = ["sau_worker*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
sau_worker = ["release-host.sh", "release-host.ps1"]
