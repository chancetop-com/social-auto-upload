<!doctype html><meta charset="utf-8">
<nav><a href="/latest/home">Business Suite</a></nav>
<section data-surface="lib:bizweb_create_post:left_panel">
  <button role="combobox" aria-haspopup="listbox" onclick="choices.hidden=false">
    <span id="actor">Page AB</span><img alt="Facebook">
  </button>
  <div role="listbox" id="choices" hidden>
    <button role="option" onclick="selectPage('Page A', '111')">Page A</button>
    <button role="option" onclick="selectPage('Page AB', '222')">Page AB</button>
  </div>
</section>
<div data-surface="lib:bizweb_create_post:media" id="media">
  <input id="file" type="file" hidden>
  <button onclick="file.click()">Upload</button>
</div>
<div role="textbox" contenteditable="true">Initial caption</div>
<footer data-surface="lib:bizweb_create_post:footer" id="footer">
  <button role="button">Cancel</button><button role="button">Draft</button>
  <button role="button" onclick="publish()">Publish</button>
</footer>
<script>
function selectPage(name, id) {
  actor.textContent = name;
  history.replaceState({}, '', '?asset_id=' + id);
  choices.hidden = true;
}
selectPage('Page AB', '222');
file.onchange = () => {
  const preview = document.createElement('img');
  preview.alt = 'Image preview';
  media.append(preview, Object.assign(document.createElement('span'), {textContent:'1 x 1'}));
};
async function publish() {
  const post = new URLSearchParams({
    fb_api_req_friendly_name: 'BusinessComposerStoryCreationMutation',
    actor: actor.textContent, id: new URL(location).searchParams.get('asset_id'),
    caption: document.querySelector('[contenteditable]').innerText, file: file.files[0].name
  });
  await fetch('/api/graphql', {method:'POST', body:post});
}
</script>
